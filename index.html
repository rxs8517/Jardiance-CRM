<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0a8a82">
<title>JARDIANCE Support</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!--
  JARDIANCE CRM re-engagement landing experience (EZScript Patient360).
  Entry: link in the generic re-engagement email / SMS.
    #email | #sms              → channel token, savings history unknown
    #email-had | #sms-had      → CRM knows the patient had a Savings Card (Q3 skipped)
    #email-none | #sms-none    → CRM knows no card (Q3 skipped)
  MLR/PRC: tile titles and drug copy come from the client INTERNAL_TILES library (section refs in data-ref);
  ISI and indications are placeholders built from current public BI materials. Replace with approved copy before use.
-->
<style>
:root{
  --teal:#0a8a82; --tealD:#077069; --tealL:#d6efec; --tealXL:#eef8f7;
  --navy:#0d3b5c; --navy2:#123e5c; --yel:#ffc629; --bg:#f2f3f7; --ink:#1d2a35; --mut:#5d6b78;
  --line:#dfe5ea; --warnBg:#fff8e1; --warnLn:#f5d77a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg)}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;text-align:inherit}
a{color:var(--teal)}

/* ---------- shell: full-bleed on phones, device frame on desktop ---------- */
.app{min-height:100%;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
.sbar{display:none}
.view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
@media (min-width:620px){
  body{background:radial-gradient(circle at 50% 30%,#eef3f5,#d6dee3);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px 0}
  .frame{width:414px;height:880px;max-height:calc(100vh - 48px);min-height:700px;background:#111;border-radius:58px;padding:13px;box-shadow:0 40px 80px -30px rgba(13,31,45,.55),inset 0 0 0 2px #2a2a2a}
  .app{height:100%;min-height:0;border-radius:46px}
  .sbar{display:flex;height:48px;flex:none;align-items:center;justify-content:space-between;padding:0 32px 0 38px;font-weight:600;font-size:15px;position:relative;background:var(--bg)}
  .sbar .notch{position:absolute;left:50%;top:0;transform:translateX(-50%);width:150px;height:32px;background:#111;border-radius:0 0 20px 20px}
  .view::-webkit-scrollbar{width:0}
}

/* ---------- brand chrome ---------- */
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--tealL);font-size:13px}
.tabs a{padding:11px 0;text-align:center;color:var(--navy2);text-decoration:none}
.tabs a+a{border-left:2px solid #fff}
.logo{background:#fff;display:flex;justify-content:center;padding:10px 0 12px;border-bottom:2px solid var(--navy2)}
.dh{position:sticky;top:0;z-index:5;background:var(--teal);color:#fff;display:flex;align-items:center;gap:12px;padding:14px 16px;font-size:18px;font-weight:700;line-height:1.2}
.dh .t{flex:1}
.dh button{display:grid;place-items:center;width:30px;height:30px;flex:none}

/* ---------- start / qualifier ---------- */
.q{padding:20px 20px 26px}
.hero{background:linear-gradient(160deg,#0d3b5c,#0a8a82);color:#fff;border-radius:20px;padding:22px 20px;margin-bottom:18px}
.hero h1{font-size:23px;line-height:1.22;margin-bottom:9px;font-weight:800}
.hero p{font-size:14px;opacity:.92;line-height:1.5}
.steps3{display:flex;gap:8px;margin-top:16px}
.steps3 div{flex:1;background:rgba(255,255,255,.15);border-radius:12px;padding:9px 6px;font-size:11.5px;line-height:1.3;text-align:center}
.steps3 b{display:block;font-size:17px;color:var(--yel)}
.cta{display:block;width:100%;background:var(--teal);color:#fff;font-weight:700;font-size:16px;border-radius:28px;padding:15px;text-align:center;transition:.15s}
.cta:active{transform:scale(.98)}
.cta:disabled{opacity:.35;cursor:default}
.cta.y{background:var(--yel);color:var(--ink)}
.cta.o{background:#fff;color:var(--teal);border:1.5px solid var(--teal)}
.lnk{display:block;text-align:center;margin-top:14px;font-size:14px;color:var(--teal);font-weight:600;width:100%}
.priv{font-size:12px;color:var(--mut);margin-top:16px;line-height:1.45;display:flex;gap:7px}
.prog{display:flex;gap:6px;margin-bottom:16px}
.prog i{height:4px;flex:1;border-radius:4px;background:#d5dde3;transition:.3s}
.prog i.on{background:var(--teal)}
.back{font-size:13px;color:var(--mut);font-weight:600;margin-bottom:12px;display:inline-flex;align-items:center;gap:4px}
.qk{font-size:11px;font-weight:700;letter-spacing:.8px;color:var(--teal);text-transform:uppercase;margin-bottom:6px}
.qh{font-size:22px;font-weight:700;color:var(--navy2);line-height:1.25;margin-bottom:6px}
.qs{font-size:13.5px;color:var(--mut);line-height:1.45;margin-bottom:16px}
.ans{display:flex;flex-direction:column;gap:9px;margin-bottom:6px}
.a{background:#fff;border:1.5px solid var(--line);border-radius:15px;padding:13px 14px;display:flex;align-items:center;gap:12px;font-size:15px;font-weight:600;transition:.15s;width:100%}
.a small{display:block;font-weight:400;color:var(--mut);font-size:12.5px;margin-top:2px}
.a .ai{width:38px;height:38px;border-radius:50%;background:var(--tealL);display:grid;place-items:center;flex:none}
.a.on{border-color:var(--teal);background:var(--tealXL)}
.a .ck{margin-left:auto;width:22px;height:22px;border-radius:7px;border:1.5px solid #b9c6cf;flex:none;display:grid;place-items:center}
.a.on .ck{background:var(--teal);border-color:var(--teal)}
.build{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:40px 30px;text-align:center}
.spin{width:64px;height:64px;border-radius:50%;border:5px solid var(--tealL);border-top-color:var(--teal);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.build h2{color:var(--navy2);font-size:19px}
.build p{font-size:13.5px;color:var(--mut)}

/* ---------- home ---------- */
.forchip{margin:12px 16px 0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 11px;display:flex;align-items:center;gap:8px;font-size:12.5px;line-height:1.35}
.forchip b{color:var(--teal)}
.forchip button{margin-left:auto;color:var(--teal);font-weight:700;text-decoration:underline;flex:none}
.sec{font-size:16px;font-weight:700;color:var(--navy2);margin:16px 16px 9px}
.msg{margin:0 16px 10px;border-radius:15px;padding:13px 12px;display:flex;align-items:center;gap:10px;font-size:14px;line-height:1.38;width:calc(100% - 32px);text-align:left}
.msg.dark{background:linear-gradient(100deg,#0d3b5c,#0a8a82);color:#fff}
.msg.light{background:linear-gradient(100deg,#f3f8f8,#d6efec);border:1px solid #e3ecec}
.mi{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--tealL)}
.msg.dark .mi{background:#e3f4f2}
.mt{flex:1}
.pill{background:var(--yel);color:var(--ink);font-weight:700;font-size:13px;border-radius:20px;padding:8px 12px;white-space:nowrap;flex:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:0 16px}
.tile{background:#fff;border:1px solid #d9ecea;border-radius:13px;min-height:108px;padding:12px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:7px;box-shadow:0 2px 6px rgba(13,59,92,.06);transition:.15s}
.tile:active{transform:scale(.97)}
.tile .ic{width:40px;height:40px;border-radius:50%;background:var(--tealL);display:grid;place-items:center}
.tile .tl{font-size:12.5px;font-weight:600;text-align:center;line-height:1.25}
.tile .bdg{font-size:9px;font-weight:800;background:var(--yel);border-radius:6px;padding:1px 6px;margin-top:-3px;letter-spacing:.3px}
.also{margin:10px 16px 0;background:#fff;border:1px dashed var(--teal);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;align-items:center;gap:8px;color:var(--teal);font-weight:600;width:calc(100% - 32px)}

/* ---------- content ---------- */
.pad{padding:16px}
.rows{display:flex;flex-direction:column;gap:9px}
.row{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 13px;display:flex;align-items:center;gap:11px;font-size:14px;font-weight:600;width:100%;line-height:1.3}
.row .ri{width:34px;height:34px;border-radius:50%;background:var(--tealL);display:grid;place-items:center;flex:none}
.row .rt{flex:1}
.row small{display:block;font-weight:400;color:var(--mut);font-size:12px;margin-top:2px}
.sub{font-size:12px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--mut);margin:18px 0 8px}
.sub:first-child{margin-top:0}
.art h2{font-size:21px;color:var(--navy2);line-height:1.25;margin-bottom:12px}
.art p{font-size:15px;line-height:1.6;margin-bottom:13px}
.art ul{margin:0 0 14px 0;list-style:none;display:flex;flex-direction:column;gap:8px}
.art li{font-size:14.5px;line-height:1.5;padding-left:22px;position:relative}
.art li:before{content:"";position:absolute;left:4px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--teal)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--teal);font-weight:800}
.stat span{font-size:11.5px;color:var(--mut);line-height:1.3;display:block;margin-top:3px}
.foot{font-size:11.5px;color:var(--mut);line-height:1.45;margin-bottom:12px}
.note{font-size:13px;line-height:1.5;background:var(--warnBg);border:1px solid var(--warnLn);border-radius:12px;padding:11px 12px;color:#5b4a12;margin-bottom:14px}
.note.b{background:var(--tealXL);border-color:#bfe3df;color:#0b4f4b}
.next{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 14px;display:flex;align-items:center;gap:10px;width:100%}
.next small{display:block;font-size:11px;color:var(--mut);font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.next b{font-size:14px;color:var(--navy2)}
.acc{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden}
.acc+.acc{margin-top:8px}
.acc>button{width:100%;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600;font-size:14.5px;line-height:1.35}
.acc>div{display:none;padding:0 14px 14px;font-size:14px;line-height:1.55;color:#33404b}
.acc.open>div{display:block}
.acc.open>button svg{transform:rotate(45deg)}

/* ---------- savings ---------- */
.card{height:196px;border-radius:18px;background:linear-gradient(120deg,#0d3b5c 0%,#0a8a82 70%,#00a19a 100%);color:#fff;padding:18px;position:relative;overflow:hidden;margin-bottom:14px;box-shadow:0 14px 30px -14px rgba(13,59,92,.6)}
.card:after{content:"";position:absolute;right:-40px;bottom:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08)}
.card small{opacity:.85;font-size:12px}
.card h3{font-size:19px;margin-top:2px}
.card .cb{position:absolute;right:16px;top:16px;background:var(--yel);color:var(--ink);font-size:11px;font-weight:800;border-radius:8px;padding:3px 8px}
.card .cd{position:absolute;left:18px;bottom:16px;right:18px;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:11px}
.card .cd b{display:block;font-size:14px;letter-spacing:1px;font-weight:600}
.card .big{position:absolute;left:18px;bottom:18px;font-size:30px;font-weight:800}
.card .big span{font-size:12px;font-weight:500;display:block;opacity:.85}
.card.off{filter:grayscale(1);opacity:.5}
.chk{display:flex;gap:11px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:12px;font-size:14px;line-height:1.4;width:100%;text-align:left}
.chk+.chk{margin-top:8px}
.chk .bx{width:22px;height:22px;border-radius:7px;border:1.5px solid #b9c6cf;flex:none;display:grid;place-items:center;margin-top:1px}
.chk.on{border-color:var(--teal);background:var(--tealXL)}
.chk.on .bx{background:var(--teal);border-color:var(--teal)}
.fld{display:block;margin-bottom:12px}
.fld span{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin-bottom:5px}
.fld input,.fld textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:15px;background:#fff;outline:none}
.fld input:focus,.fld textarea:focus{border-color:var(--teal)}
.seg{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.seg button{flex:1;min-width:70px;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:10px 6px;font-size:13px;font-weight:600;color:var(--mut);text-align:center}
.seg button.on{border-color:var(--teal);background:var(--tealXL);color:var(--teal)}
.ok{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:10px 0 18px}
.ok .c{width:64px;height:64px;border-radius:50%;background:var(--tealL);display:grid;place-items:center}
.ok h2{font-size:20px;color:var(--navy2)}
.ok p{font-size:14px;color:var(--mut);line-height:1.5}
.btns{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.contact{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px;font-size:13.5px;line-height:1.5;margin-bottom:10px}
.contact b{color:var(--navy2)}

/* ---------- ISI ---------- */
.isi{background:#fff;margin-top:22px;border-top:1px solid var(--line)}
.isih{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-weight:700;font-size:15px;color:var(--teal);width:100%;border-bottom:1px solid var(--line)}
.isib{padding:10px 14px 4px;font-size:13px;line-height:1.5;color:#2c3640}
.isib p{margin-bottom:8px}
.isib ul{margin:0 0 8px 18px}
.isib li{margin-bottom:3px}
.isi .more{display:none}
.isi.open .more{display:block}
.isi.open .isih svg{transform:rotate(45deg)}
.ind{display:none;padding:10px 14px;font-size:13px;line-height:1.5;border-bottom:1px solid var(--line)}
.ind.open{display:block}
.ind ul{margin:6px 0 6px 18px}
.pc{font-size:10.5px;font-weight:700;text-align:right;padding:2px 14px 6px;color:#444}
.legal{padding:4px 14px 22px;font-size:11px;color:var(--mut);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.legal button{color:var(--mut);text-decoration:underline;font-size:11px}

/* ---------- toast + sheet ---------- */
.toast{position:absolute;left:14px;right:14px;bottom:18px;background:#0D1F2D;color:#fff;border-radius:13px;padding:12px 14px;font-size:13px;line-height:1.4;z-index:30;transform:translateY(calc(100% + 60px));opacity:0;transition:.3s;pointer-events:none}
.toast.on{transform:none;opacity:1}
.sheetbg{position:absolute;inset:0;background:rgba(13,31,45,.45);z-index:40;display:none}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:16px 18px 24px;z-index:41;display:none;max-height:86%;overflow-y:auto}
.sheet.on,.sheetbg.on{display:block}
@media (max-width:619px){.toast,.sheet,.sheetbg{position:fixed}}
.sheet h3{font-size:16px;color:var(--navy2);margin-bottom:4px}
.sheet .hint{font-size:12px;color:var(--mut);margin-bottom:12px}
.sheet .lbl{font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--mut);margin:12px 0 6px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sgrid button{border:1.5px solid var(--line);border-radius:10px;padding:8px;font-size:12px;text-align:left;line-height:1.3}
.sgrid button b{display:block;font-size:11px;color:var(--teal)}
</style>
</head>
<body>
<div class="frame"><div class="app" id="app">
  <div class="sbar"><span>12:22</span><div class="notch"></div>
    <svg width="44" height="12" viewBox="0 0 44 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#111"/><rect x="4.5" y="6" width="3" height="6" rx="1" fill="#111"/><rect x="9" y="3.5" width="3" height="8.5" rx="1" fill="#111"/><rect x="13.5" y="1" width="3" height="11" rx="1" fill="#111"/><rect x="20.5" y="1" width="21" height="10" rx="3" fill="none" stroke="#111"/><rect x="22" y="2.5" width="18" height="7" rx="1.5" fill="#111"/></svg>
  </div>
  <main class="view" id="view"></main>
  <div class="toast" id="toast"></div>
  <div class="sheetbg" id="sheetbg" data-act="closeSheet"></div>
  <div class="sheet" id="sheet"></div>
</div></div>

<script>
/* =====================================================================
   1. CONTENT
   ===================================================================== */
const PI_URL='https://content.boehringer-ingelheim.com/DAM/7d9c411c-ec33-4f82-886f-af1e011f35bb/jardiance-us-pi.pdf';
const MG_URL='https://content.boehringer-ingelheim.com/DAM/6fd144e0-7eb2-4ab3-9fca-af1e011f41a6/jardiance-us-mg.pdf';
const HF_BROCHURE='https://content.boehringer-ingelheim.com/DAM/103a231c-45f6-4513-9b49-b10f00f60771/pc-us-137349%20jardiance%20hf%20patient%20brochure%20digital%20version.pdf';
// MLR: client screens say "$0 for a 30- to 90-day prescription"; live BI pricing page says "as little as $10 per month". Confirm before launch.
const OFFER='as little as $0 for a 30- to 90-day prescription';

const COND={
 t2d:{name:'Type 2 Diabetes',lower:'type 2 diabetes',short:'T2D',icon:'drop',
  hook:'Explore JARDIANCE for type 2 diabetes: A1C, blood sugar and your heart.',hookTo:'hub-t2d-jfor',
  secs:{
   about:{t:'About Type 2 Diabetes',ref:'1.1',icon:'book',arts:[
    {h:'What is type 2 diabetes?',b:['Type 2 diabetes is the most common type of diabetes. It develops when the body can’t properly break down sugar in the bloodstream, either because it doesn’t make enough insulin or can’t use it properly.','If not treated, it can cause long-term health complications such as cardiovascular (CV) disease.','Whether you’re newly diagnosed or working on a treatment plan, it can be difficult to know where to start. Keep reading for helpful information.']},
    {h:'Causes of type 2 diabetes',b:['The exact cause of type 2 diabetes is unknown, but there are some factors linked to its development:',{ul:['A history of high blood sugar, prediabetes and/or diabetes during pregnancy','Genetics and family history','Age','Overweight and obesity','Physical inactivity','Race and ethnicity','High blood pressure','Abnormal cholesterol']}]},
    {h:'Type 2 diabetes symptoms',b:['Symptoms can develop slowly. Talk to your healthcare provider if you notice:',{ul:['Increased thirst and frequent urination','Increased hunger','Unintended weight loss','Fatigue','Blurred vision','Slow-healing sores and frequent infections','Areas of darkened skin, usually in the armpits and neck']}]},
    {h:'Type 2 diabetes & your heart',b:['Over time, high blood sugar levels can cause plaque to build up in your blood vessels. This increases your risk of cardiovascular (CV) disease.','Type 2 diabetes can increase your risk of dying from a CV event, even if your A1C is under control. That’s why it’s important to think about your heart, too.',{go:['See how JARDIANCE can help','hub-t2d-jfor']}]}
   ]},
   second:{t:'Understanding A1C',ref:'1.2',icon:'chart',arts:[
    {h:'What is A1C?',b:['A1C is a blood test that’s commonly used to diagnose diabetes. It’s also known as the hemoglobin A1C or HbA1c test, and it measures your average blood sugar levels over the past two to three months.','The resulting number gives you and your healthcare provider a glimpse into how well your blood sugar (glucose) is controlled.',{stats:[['<5.7%','Normal'],['5.7–6.5%','Prediabetes'],['6.5%+','Diabetes']]}]},
    {h:'Why should you get an A1C test?',b:['An initial test helps your healthcare provider establish a baseline A1C level and develop a treatment plan.','Following that, regular testing helps your provider monitor how well your treatment is working over time.']},
    {h:'When should you get an A1C test?',b:['If A1C goals are being met, twice-a-year testing is often recommended. If not, more frequent testing may be suggested.','Your healthcare provider will determine what’s best for you.',{go:['Set a reminder for my next test','reminder']}]},
    {h:'Managing your A1C level',b:['Lowering A1C takes time and requires a type 2 diabetes treatment plan.','Work with your healthcare provider to create a program that includes a healthy diet, an exercise routine, and a type 2 diabetes medication like JARDIANCE to lower your blood sugar and A1C.']}
   ]},
   jfor:{t:'JARDIANCE for Type 2 Diabetes',ref:'1.3',icon:'clip',arts:[
    {h:'Breakthrough CV benefit',b:['JARDIANCE significantly reduced the risk of cardiovascular (CV) death for adults who have type 2 diabetes and known heart disease.','JARDIANCE was tested in a 3-year clinical trial of over 7,000 adults with type 2 diabetes and CV disease. People in the study were already taking common type 2 diabetes and CV medicines (statins, beta blockers, ACE inhibitors, etc).',{note:'The current American Diabetes Association® Standards of Care recommend SGLT2 inhibitors, which include empagliflozin (the active ingredient in JARDIANCE), as a treatment option for adults with type 2 diabetes and known heart disease, with or without metformin.'}]},
    {h:'Lower A1C and blood sugar',b:['JARDIANCE helped some people achieve an A1C of less than 7%.*',{stats:[['13%','Placebo'],['38%','JARDIANCE 10 mg'],['39%','JARDIANCE 25 mg']]},{foot:'*Percent of people whose A1C dropped below 7% in a 24-week study of adults with type 2 diabetes.'}]},

function homeCfg(){
  const s=segId(P), c=P.conds[0], C=c?COND[c]:null;
  let m1,m2,tiles,chip;
  const offerTxt='Eligible patients can pay '+OFFER+'.';
  if(s==='S1'){
    m1={i:'phone',t:'Welcome to JARDIANCE Support. Explore tips, tools and resources.',to:'support'};
    m2={i:'card',t:offerTxt,to:'savings'};
    tiles=[['cond-t2d','Type 2 Diabetes','drop'],['cond-hf','Heart Failure','heart'],['cond-ckd','Chronic Kidney Disease','kidney'],['taking','Taking JARDIANCE','pill'],['savings','Pricing & Savings','card'],['support','Support & Resources','phone']];
    chip=null;
  } else if(P.role==='cg'){
    m1={i:'pin',t:`Caring for someone with ${C.lower}? Find tips to help them, and support for you.`,to:'cg'};
    m2={i:'card',t:'Help your loved one save: eligible patients can pay '+OFFER+'.',to:'savings'};
    tiles=[['cg','Caregiver Support Center','care'],[`hub-${c}-about`,'Understanding the Condition','book'],['treat','Treatment & Medication Resources','clip'],['ddg','Doctor Discussion Guide','doc'],['faqs','FAQs','q'],['savings','Pricing & Savings','card']];
    chip={who:'Someone I care for',what:C.name};
  } else {
    const hook={i:C.icon,t:C.hook,to:C.hookTo};
    if(isGov(P)||isUnins(P)){ m1=hook; m2={i:'shield',t:'Explore support options that fit your coverage.',to:'savings'}; }
    else if(P.enrolled){ m1={i:'card',t:'Your JARDIANCE Savings Card is ready. Show it at your next refill.',to:'savings',cta:'View'}; m2=hook; }
    else if(P.sav==='had'){ m1={i:'card',t:'Welcome back. Make sure your JARDIANCE Savings Card is still active before your next refill.',to:'savings',cta:'Check'}; m2=hook; }
    else if(isGov(P)||isUnins(P)){ m1=hook; m2={i:'shield',t:'Explore support options that fit your coverage.',to:'savings'}; }
    else { m1={i:'card',t:(P.sav==='unsure'?'Not sure if you have a card? Check in a minute. ':'')+offerTxt,to:'savings',cta:P.sav==='unsure'?'Check':'View'}; m2=hook; }
    const secIcon={t2d:'chart',hf:'user',ckd:'kidney'}[c];
    tiles=[[`hub-${c}-jfor`,C.secs.jfor.t.replace('Chronic Kidney Disease','CKD'),'clip'],[`hub-${c}-second`,C.secs.second.t,secIcon],[`hub-${c}-living`,C.secs.living.t,'heart'],['taking','Taking JARDIANCE','pill'],['ddg','Doctor Discussion Guide','doc'],['savings','Pricing & Savings','card']];
    chip={who:'Me',what:P.conds.map(k=>COND[k].name).join(' + ')};
  }
  return {m1,m2,tiles,chip};
}
function vHome(){
  const {m1,m2,tiles,chip}=homeCfg();
  const extra=P.role==='pt'&&P.conds.length>1?P.conds.slice(1):[];
  const cardBadge=P.role==='pt'&&(P.sav==='had'||P.enrolled)&&!isGov(P)&&!isUnins(P);
  return chrome(`${chip?`<div class="forchip">${ic(P.role==='cg'?'care':'user',16)}<span>For: <b>${chip.who}</b> · ${chip.what}</span><button data-act="change">Change</button></div>`

function rowsHtml(list){return `<div class="rows">${list.map(r=>`<button class="row" data-go="${r.to}"><span class="ri">${ic(r.icon||'book',17)}</span><span class="rt">${r.t}${r.s?`<small>${r.s}</small>`:''}</span>${ic('chev',16,'#9aa7b2')}</button>`).join('')}</div>`}

function vHub(c,k){
  const s=k==='taking'?TAKING:COND[c].secs[k];
  const base=k==='taking'?'art-taking':`art-${c}-${k}`;
  const cgNote=P&&P.role==='cg'&&k==='about'?`<div class="note b">Written for patients. Read it with your loved one in mind.</div>`:'';
  return chrome(`<div class="pad" data-ref="${s.ref}">${cgNote}${rowsHtml(s.arts.map((a,i)=>({t:a.h,icon:s.icon,to:`${base}-${i}`})))}</div>`,{head:s.t});
}
function blocks(b){
  return b.map(x=>{
    if(typeof x==='string') return `<p>${x}</p>`;
    if(x.ul) return `<ul>${x.ul.map(i=>`<li>${i}</li>`).join('')}</ul>`;
    if(x.stats) return `<div class="stats">${x.stats.map(s=>`<div class="stat"><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}</div>`;
    if(x.note) return `<div class="note b">${x.note}</div>`;
    if(x.foot) return `<p class="foot">${x.foot}</p>`;
    if(x.go) return `<button class="cta o" style="margin-bottom:14px" data-go="${x.go[1]}">${x.go[0]}</button>`;
    return '';
  }).join('');
}
function vArt(c,k,i){
  const s=k==='taking'?TAKING:COND[c].secs[k]; const a=s.arts[i]; if(!a) return vHome();
  const base=k==='taking'?'art-taking':`art-${c}-${k}`;

  return chrome(`<article class="pad art" data-ref="${s.ref}"><h2>${a.h}</h2>${blocks(a.b)}

  if(p.enrolled||(p.role==='pt'&&p.sav==='had')) return vMyCard();

  return chrome(`<div class="pad">${prog(3,3)}<div class="ok"><div class="c">${ic('check',32,'#0a8a82',2.6)}</div><h2>You're all set${k&&k.name?', '+k.name:''}!</h2><p>Show this card to your pharmacist at your next fill.</p></div>

   <div class="sub">Something changed?</div>${rowsHtml([{t:'My insurance changed',s:'Medicare or Medicaid can’t use the card. We’ll show other options',icon:'shield',to:'updateins'},{t:'I lost my card',s:'Get your card details again',icon:'card',to:'findcard'},{t:'How to use your card at the pharmacy',icon:'q',to:'howto'}])}</div>`,{head:'My Savings Card'});
}
function vHowto(){return chrome(`<div class="pad art"><h2>Using your card at the pharmacy</h2><ul><li>Show your Savings Card along with your insurance card when you fill your JARDIANCE prescription.</li><li>Your pharmacist runs your insurance first, then applies the card to lower your out-of-pocket cost.</li><li>Keep the card details on your phone so you always have them.</li></ul><p class="foot">Terms and conditions apply. Not valid for government-insured or cash-paying patients.</p></div>`,{head:'How it works'})}
function vFind(){
  if(UI.found==='none') return chrome(`<div class="pad"><div class="ok"><div class="c">${ic('q',30)}</div><h2>We couldn't find a card</h2><p>No problem. If you're eligible, you can get one now.</p></div><div class="btns"><button class="cta y" data-act="enrollStart">Get my Savings Card</button><button class="lnk" data-go="home">Back to home</button></div></div>`,{head:'Find my card'});
  return chrome(`<div class="pad"><div class="art"><h2>Find my card</h2><p>Enter the mobile number you used to sign up and we'll look it up.</p></div>
   <label class="fld"><span>Mobile number</span><input id="findmob" inputmode="tel" placeholder="(555) 555-0123"></label>
   <button class="cta" data-act="findGo">Look up my card</button><p class="foot" style="margin-top:10px">Demo: lookup is simulated.</p></div>`,{head:'Find my card'});
}
function vPap(){
  const p=P||{}; const lbl={mcare:'Medicare',mcaid:'Medicaid',none:'no insurance'}[p.ins];
  // Source: patient.boehringer-ingelheim.com/us/products/jardiance/heart-failure/pricing (fetched 2026-11-15)
  return chrome(`<div class="pad">${lbl?`<div class="note">Because you have ${lbl}, the Savings Card isn't available. Here are options that may help.</div>`:''}
   ${!p.ins||p.ins==='mcare'?`<div class="sub">If you have Medicare Part D</div><div class="stats"><div class="stat"><b>59%</b><span>of Part D patients pay $0–$50 a month</span></div><div class="stat"><b>$4–$10</b><span>average monthly cost with Extra Help</span></div></div><p class="foot">The remaining 41% pay about $169 a month on average. Costs can vary through the year depending on your Part D benefit phase.</p>`:''}
   <div class="sub">Patient assistance</div>
   <div class="contact"><b>Boehringer Ingelheim Cares Foundation</b><br>Provides medicines free of charge to eligible patients.<br>1-800-556-8317 · 8:30 a.m.–6:00 p.m. ET<br><a href="https://www.bipatientassistance.com" target="_blank" rel="noopener">See if you qualify at bipatientassistance.com</a></div>
   ${rowsHtml([{t:'Questions to ask about cost',s:'Add them to your Doctor Discussion Guide',icon:'doc',to:'ddg'},{t:'Wrong coverage? Update it',icon:'shield',to:'updateins'}])}</div>`,{head:'Ways to save'});
}
function vShare(){
  const msg=`I found savings for JARDIANCE. Eligible patients with commercial insurance can pay ${OFFER}. You can sign up here: jrd.support/save`;
  return chrome(`<div class="pad"><div class="card"><small>For your loved one</small><h3>JARDIANCE Savings Card</h3><div class="big">$0<span>for a 30- to 90-day prescription*</span></div></div>
   <div class="note b">Only the patient can sign up for the Savings Card. Send them the link and they can finish in a few minutes.</div>
   <label class="fld"><span>Message to send</span><textarea id="shareTxt" rows="4">${msg}</textarea></label>
   <div class="btns"><button class="cta y" data-act="shareCopy">Copy message</button><button class="cta o" data-go="pap">They have Medicare, Medicaid or no insurance</button></div>
   <p class="foot" style="margin-top:12px">*For eligible commercially insured patients. Terms and conditions apply.</p></div>`,{head:'Help them save'});
}

/* =====================================================================
   10. RENDER + EVENTS
   ===================================================================== */
const NEEDS_Q=['q1','q2','q3','q4'];
function render(){
  const v=document.getElementById('view'); let r=route(); let h;
  if(building){v.innerHTML=vBuilding();return}
  if(!r) r=P?'home':'start';
  if(!P && !['start','q1','q2','q3','q4'].includes(r)) r='start';
  if(r==='start') h=vStart();
  else if(r==='q1') h=vQ1(); else if(r==='q2') h=vQ2(); else if(r==='q3') h=vQ3(); else if(r==='q4'||r==='updateins') {if(r==='updateins'){UI.insOnly=true;D={...P,conds:[...P.conds],unsure:false};} h=vQ4();}
  else if(r==='home') h=vHome();
  else if(r.startsWith('cond-')) h=vCond(r.slice(5));
  else if(r.startsWith('hub-')){const [,c,k]=r.split('-');h=vHub(c,k)}
  else if(r==='taking') h=vHub(null,'taking');
  else if(r.startsWith('art-taking-')) h=vArt(null,'taking',+r.split('-')[2]);
  else if(r.startsWith('art-')){const [,c,k,i]=r.split('-');h=vArt(c,k,+i)}
  else if(r==='treat') h=P.conds[0]?vTreat():vHome();
  else if(r==='faqs') h=vFaqs(); else if(r==='support') h=vSupport(); else if(r==='cg') h=vCg();
  else if(r==='ddg') h=vDdg(); else if(r==='reminder') h=vReminder();
  else if(r==='savings') h=vSavings(); else if(r==='enroll') h=vEnroll(); else if(r==='findcard') h=vFind();
  else if(r==='pap') h=vPap(); else if(r==='howto') h=vHowto();
  else h=vHome();
  v.innerHTML=h;
  track('page_view',{page:r});
}

function begin(){D={role:null,conds:[],sav:null,ins:null,unsure:false,pendingCond:null};UI.insOnly=false;track('qualifier_start');nav('q1')}
function finish(){
  commit(); building=true; render();
  setTimeout(()=>{building=false; depth=0; location.replace('#home'); render()},1100);
}
function afterCond(){
  if(D.role==='cg') return finish();
  if(ENTRY.crm!=='unknown'){D.sav=ENTRY.crm; if(D.sav==='had') return finish(); return nav('q4')}
  nav('q3');
}

document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){ if(g.dataset.msg) track('personal_message_click',{slot:g.dataset.msg,to:g.dataset.go}); else track('tile_click',{to:g.dataset.go}); nav(g.dataset.go); return }
  const a=e.target.closest('[data-act]'); if(!a) return;
  const [act,arg,arg2]=a.dataset.act.split(':');
  switch(act){
    case 'begin': begin(); break;
    case 'skip': D={role:'explore',conds:[],sav:null,ins:null}; track('qualifier_skip'); finish(); break;
    case 'back': goBack(); break;
    case 'change': UI.insOnly=false; D={role:null,conds:[],sav:null,ins:null,unsure:false,pendingCond:null}; nav('q1'); break;
    case 'tailor': D={role:null,conds:[],sav:null,ins:null,unsure:false,pendingCond:arg}; track('tailor_from_hub',{cond:arg}); nav('q1'); break;
    case 'role':
      D.role=arg; track('answer',{q:'role',a:arg});
      if(arg==='explore') return finish();
      if(D.pendingCond){D.conds=[D.pendingCond];D.pendingCond=null;return afterCond()}
      nav('q2'); break;
    case 'cond':
      if(arg==='unsure'){D.unsure=!D.unsure; if(D.unsure) D.conds=[]}
      else {D.unsure=false; const i=D.conds.indexOf(arg); i>-1?D.conds.splice(i,1):D.conds.push(arg)}
      render(); break;
    case 'condNext': track('answer',{q:'conditions',a:D.unsure?'unsure':D.conds}); if(D.unsure){D.conds=[];return finish()} afterCond(); break;
    case 'sav': D.sav=arg; track('answer',{q:'savings',a:arg}); if(arg==='had') return finish(); nav('q4'); break;
    case 'ins': D.ins=arg; track('answer',{q:'coverage',a:arg});
      if(UI.insOnly){UI.insOnly=false; if(arg==='comm'&&D.sav!=='had') D.sav='none'; commit(); toast('Coverage updated'); depth=0; location.replace('#savings'); return}
      finish(); break;
    case 'acc': a.parentElement.classList.toggle('open'); break;
    case 'toggleIsi': document.getElementById('isi').classList.toggle('open'); track('isi_expand'); break;
    case 'toggleInd': document.getElementById('ind').classList.toggle('open'); break;
    // savings
    case 'enrollStart': UI.enr=1; UI.att={}; UI.consent=false; track('savings_enroll_start'); nav('enroll'); break;
    case 'att': UI.att[arg]=!UI.att[arg]; render(); break;
    case 'notEligible': track('savings_ineligible'); location.replace('#pap'); break;
    case 'enr2': UI.enr=2; render(); toTop(); break;
    case 'consent': {const fn=document.getElementById('fn').value, mb=document.getElementById('mob').value; UI.consent=!UI.consent; render(); document.getElementById('fn').value=fn; document.getElementById('mob').value=mb; break}
    case 'enr3': {
      const fn=(document.getElementById('fn').value||'').trim().slice(0,30);
      // Demo values only: real Member ID/BIN/PCN/Group are returned by the JARDIANCE savings API callback.
      const card={name:fn.replace(/[<>&"]/g,''),id:'JRD'+Math.floor(10000000+Math.random()*89999999),grp:'EC'+Math.floor(1000+Math.random()*8999),bin:'610020',pcn:'PDMI'};
      if(!P){P={role:'pt',conds:[],sav:null,ins:'comm'}}
      P.enrolled=true; P.card=card; P.ins='comm'; if(P.role==='pt') P.sav='had'; store.set('profile',P); track('savings_enroll_complete');
      UI.enr=3; render(); toTop(); break}
    case 'wallet': toast('Demo: card would be added to Apple Wallet / Google Wallet.'); track('wallet_add'); break;
    case 'copyCard': {const k=P.card; copy(`JARDIANCE Savings Card\nMember ID: ${k.id}\nGroup: ${k.grp}\nBIN: ${k.bin}\nPCN: ${k.pcn}`,'Card details'); break}
    case 'checkCard': UI.cardChecked=true; track('savings_card_check'); render(); break;
    case 'findGo': UI.found='none'; track('savings_card_lookup'); render(); break;
    case 'shareCopy': copy(document.getElementById('shareTxt').value,'Message'); track('caregiver_share_savings'); break;
    // DDG
    case 'ddgc': UI.ddgC=arg; render(); break;
    case 'ddgq': {const s=store.get('ddg',{c:null,q:[],notes:''}); if(s.c!==UI.ddgC){s.c=UI.ddgC;s.q=[];s.notes=''} const i=+arg; s.q.includes(i)?s.q.splice(s.q.indexOf(i),1):s.q.push(i); const n=document.getElementById('ddgNotes'); if(n) s.notes=n.value; store.set('ddg',s); render(); break}
    case 'ddgSave': {const s=store.get('ddg',{c:UI.ddgC,q:[],notes:''}); s.c=UI.ddgC; s.notes=document.getElementById('ddgNotes').value; store.set('ddg',s); track('ddg_save',{n:s.q.length}); toast('Your guide is saved on this device.'); break}
    case 'ddgCopy': {const s=store.get('ddg',{c:UI.ddgC,q:[],notes:''}); const C=COND[UI.ddgC]; const qs=(s.c===UI.ddgC?s.q:[]).sort().map(i=>'• '+C.ddg[i]); const notes=document.getElementById('ddgNotes').value; copy(`My questions about ${C.lower}:\n${qs.join('\n')||'(none selected)'}${notes?`\n\nNotes: ${notes}`:''}`,'Questions'); break}
    // reminders
    case 'rem': UI.rem[arg]=a.dataset.act.split(':').slice(2).join(':'); render(); break;
    case 'remSave': store.set('reminder',UI.rem); track('reminder_set',UI.rem); toast('Reminder saved.'); render(); break;
    // demo tools
    case 'demo': openDemo(); break;
    case 'closeSheet': closeSheet(); break;
    case 'dch': ENTRY.ch=arg; store.set('entry',ENTRY); openDemo(); break;
    case 'dcrm': ENTRY.crm=arg; store.set('entry',ENTRY); openDemo(); break;
    case 'djump': jump(arg); break;
    case 'dreset': store.clear(); P=null; ENTRY={ch:ENTRY.ch,crm:ENTRY.crm}; store.set('entry',ENTRY); UI={enr:1,att:{},cardChecked:false,found:null}; closeSheet(); depth=0; location.replace('#start'); render(); break;
  }
});

function toTop(){document.getElementById('view').scrollTop=0;try{window.scrollTo(0,0)}catch(e){}}
/* ---------- demo tools sheet (presenter only) ---------- */
const SEGS=[['S1','Generic',{role:'explore',conds:[]}],['S2a','T2D · had card',{role:'pt',conds:['t2d'],sav:'had'}],['S2b','T2D · no card',{role:'pt',conds:['t2d'],sav:'none',ins:'comm'}],['S3a','HF · had card',{role:'pt',conds:['hf'],sav:'had'}],['S3b','HF · no card',{role:'pt',conds:['hf'],sav:'none',ins:'comm'}],['S4a','CKD · had card',{role:'pt',conds:['ckd'],sav:'had'}],['S4b','CKD · no card',{role:'pt',conds:['ckd'],sav:'none',ins:'comm'}],['S5','Caregiver · T2D',{role:'cg',conds:['t2d']}],['S6','Caregiver · HF',{role:'cg',conds:['hf']}],['S7','Caregiver · CKD',{role:'cg',conds:['ckd']}],['S3b+','HF · Medicare',{role:'pt',conds:['hf'],sav:'none',ins:'mcare'}],['S2b+','T2D + CKD · no card',{role:'pt',conds:['t2d','ckd'],sav:'none',ins:'comm'}]];
function openDemo(){
  const s=document.getElementById('sheet'), cur=P?segId(P):'—';
  s.innerHTML=`<h3>Demo tools</h3><div class="hint">For presenters. Current segment: <b>${cur}</b></div>
   <div class="lbl">Entry link</div><div class="seg"><button class="${ENTRY.ch==='email'?'on':''}" data-act="dch:email">Email</button><button class="${ENTRY.ch==='sms'?'on':''}" data-act="dch:sms">SMS</button></div>
   <div class="lbl">Savings history known from CRM</div><div class="seg"><button class="${ENTRY.crm==='unknown'?'on':''}" data-act="dcrm:unknown">Unknown</button><button class="${ENTRY.crm==='had'?'on':''}" data-act="dcrm:had">Had card</button><button class="${ENTRY.crm==='none'?'on':''}" data-act="dcrm:none">No card</button></div>
   <div class="lbl">Jump to a segment</div><div class="sgrid">${SEGS.map(x=>`<button data-act="djump:${x[0]}"><b>${x[0]}</b>${x[1]}</button>`).join('')}</div>
   <button class="cta" style="margin-top:14px" data-act="dreset">Reset and start over</button>`;
  s.classList.add('on'); document.getElementById('sheetbg').classList.add('on');
}
function closeSheet(){document.getElementById('sheet').classList.remove('on');document.getElementById('sheetbg').classList.remove('on')}
function jump(id){const x=SEGS.find(s=>s[0]===id);P={sav:null,ins:null,enrolled:false,card:null,...x[2],conds:[...x[2].conds]};store.set('profile',P);UI.cardChecked=false;UI.found=null;closeSheet();depth=0;location.replace('#home');render();toTop()}

/* ---------- boot: read entry token from the link ---------- */
(function boot(){
  const r=route();
  if(TOKENS.includes(r)){
    const [ch,crm]=r.split('-'); ENTRY={ch,crm:crm||'unknown'}; store.set('entry',ENTRY);
    track('reengagement_link_open',{channel:ch,crm:ENTRY.crm});
    history.replaceState(null,'',P?'#home':'#start');
  }
  render();
})();
</script>
